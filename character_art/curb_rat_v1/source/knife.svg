<svg xmlns="http://www.w3.org/2000/svg" width="80" height="120" viewBox="0 0 80 120">
  <title>Curb Rat / knife</title>
  <desc>Straight double-edged dagger in reverse grip. Grip 40,30; blade from 40,50 to 40,110. The hilt is shared by both exposed blade views. Fixed and buried form the complete blade; horizontal ends at its midpoint. The slide wall plane is y-x=40; the push plane is y=80.</desc>
  <g id="fixed" stroke-linecap="butt" stroke-linejoin="round">
    <path d="M29 50 L51 50 L49 89 L30 70 Z" fill="#91a8b6" stroke="none"/>
    <path d="M40 51 L50 51 L48 88 L40 80 Z" fill="#eaf4ee" stroke="none"/>
    <path d="M30 70 L29 50 L51 50 L49 89" fill="none" stroke="#141d27" stroke-width="2.5" stroke-linecap="butt"/>
    <path d="M40 55 L40 80" fill="none" stroke="#557583" stroke-width="1.4" stroke-linecap="butt"/>
  </g>
  <g id="buried" stroke-linecap="butt" stroke-linejoin="round">
    <path d="M30 70 L49 89 L40 110 L31 89 Z" fill="#91a8b6" stroke="none"/>
    <path d="M40 80 L48 88 L48 89 L40 108 Z" fill="#eaf4ee" stroke="none"/>
    <path d="M49 89 L40 110 L31 89 L30 70" fill="none" stroke="#141d27" stroke-width="2.5"/>
    <path d="M40 80 L40 100" fill="none" stroke="#557583" stroke-width="1.4"/>
  </g>
  <g id="horizontal" stroke-linecap="butt" stroke-linejoin="round">
    <path d="M29 50 L51 50 L49.46 80 L30.54 80 Z" fill="#91a8b6" stroke="none"/>
    <path d="M40 51 L50 51 L48.43 80 L40 80 Z" fill="#eaf4ee" stroke="none"/>
    <path d="M30.54 80 L29 50 L51 50 L49.46 80" fill="none" stroke="#141d27" stroke-width="2.5"/>
    <path d="M40 55 L40 80" fill="none" stroke="#557583" stroke-width="1.4"/>
  </g>
  <g id="hilt" stroke-linecap="round" stroke-linejoin="round">
    <path d="M34 12 L46 12 L46 47 L34 47 Z" fill="#293945" stroke="#141d27" stroke-width="3"/>
    <path d="M35 18 L45 21 M35 26 L45 29 M35 34 L45 37 M35 42 L45 44" fill="none" stroke="#758994" stroke-width="2"/>
    <path d="M33 8 L47 8 L48 14 L32 14 Z" fill="#9bb0ba" stroke="#141d27" stroke-width="2.5"/>
    <path d="M25 46 L55 46 L56 52 L24 52 Z" fill="#718993" stroke="#141d27" stroke-width="2.5"/>
  </g>
</svg>
